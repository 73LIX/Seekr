# One server, one command:  docker compose up -d
# Needs a .env file next to this one (copy .env.example) with at least DOMAIN and PUBLIC_URL.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      TRUST_PROXY: "1"
      DATA_DIR: /app/data
    volumes:
      - hunt_data:/app/data      # database + uploaded photos
    expose: ["3000"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    # GPU on the same server? Uncomment (needs the NVIDIA container toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:                     # downloads the model once, then exits
    image: ollama/ollama:latest
    restart: "no"
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-gemma4:e2b}"]

volumes:
  hunt_data:
  ollama_models:
  caddy_data:
  caddy_config:
